[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradelens"
version = "0.1.0"
description = "TradeLens global trade data visualisation."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "duckdb==1.3.1",
    "fastapi==0.115.13",
    "numpy==1.26.4",
    "pydantic==2.13.5",
    "sentence-transformers==6.0.0",
    "uvicorn==0.54.0"
]

license = { text = "MIT" }

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
    "httpx==0.28.1",
]

# packages inside ./
[tool.setuptools.packages.find]
where = ["./src/"]
